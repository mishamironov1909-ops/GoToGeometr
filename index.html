<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GoToGeomtr</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050817;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
button{border:0;color:white;font-weight:900;cursor:pointer}
#menu{position:fixed;inset:0;z-index:10;text-align:center;overflow:auto;padding:30px 12px;background:radial-gradient(circle at 50% 10%,#263f9b,#0b102d 45%,#03050e)}
.logo{font-size:clamp(48px,10vw,95px);font-weight:1000;font-style:italic;letter-spacing:-5px;text-shadow:0 0 20px #28eaff,0 7px #111}
.logo span{color:#43eaff}
.sub{opacity:.65;letter-spacing:5px;margin:12px}
.menuBtns{display:flex;justify-content:center;gap:10px;margin:25px}
.btn{padding:14px 22px;border-radius:15px;background:linear-gradient(135deg,#20dcff,#6755ff);box-shadow:0 5px #161942;font-size:15px}
.btn:active{transform:translateY(3px);box-shadow:0 2px #161942}
#stats{margin:10px}
#levels{width:min(1000px,95vw);margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(65px,1fr));gap:8px;max-height:58vh;overflow:auto;padding:5px}
.level{height:62px;border-radius:14px;background:linear-gradient(145deg,#1b2b68,#0c1230);border:2px solid #ffffff18;font-size:17px}
.level.done{background:linear-gradient(145deg,#087c70,#123b52);border-color:#32e7c8}
.level.lock{opacity:.3}
#ui{display:none;position:fixed;z-index:5;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;padding:10px;gap:7px}
.info{background:#020612bb;border:1px solid #ffffff22;border-radius:11px;padding:8px 10px;font-size:12px;font-weight:bold}
#bar{position:absolute;top:52px;left:15%;width:70%;height:7px;background:#0008;border-radius:10px;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#36eaff,#5cff8d,#fff04b);box-shadow:0 0 12px #36eaff}
#jump{display:none;position:fixed;z-index:8;right:20px;bottom:20px;width:90px;height:70px;border-radius:20px;background:#16275ddd;border:2px solid #ffffff30;font-size:30px}
#result{display:none;position:fixed;z-index:20;inset:0;background:#02040ddd;backdrop-filter:blur(8px);align-items:center;justify-content:center}
.box{width:min(430px,90vw);padding:30px 20px;text-align:center;border-radius:25px;background:linear-gradient(145deg,#1c2b67,#080d24);border:2px solid #ffffff22;box-shadow:0 20px 70px #000}
.box h1{font-size:38px;margin-bottom:15px}
.box p{opacity:.75;line-height:1.6;margin-bottom:20px}
@media(max-width:700px){#jump{display:block}.info{font-size:10px;padding:7px}.top{padding:7px}}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="menu">
    <div class="logo">GoTo<span>Geomtr</span></div>
    <div class="sub">JUMP • RUN • MASTER</div>

    <div class="menuBtns">
        <button class="btn" id="continue">▶ ПРОДОЛЖИТЬ</button>
        <button class="btn" id="reset">↻ СБРОС</button>
    </div>

    <div id="stats">
        Открыто: <b id="openCount">1</b>/100
        · Пройдено: <b id="doneCount">0</b>
    </div>

    <div id="levels"></div>
</div>

<div id="ui">
    <div class="top">
        <div class="info">GoToGeomtr</div>
        <div class="info">LEVEL <span id="lvl">1</span></div>
        <div class="info">💎 <span id="coins">0</span></div>
    </div>
    <div id="bar"><div id="fill"></div></div>
</div>

<button id="jump">↑</button>

<div id="result">
    <div class="box">
        <h1 id="resultTitle"></h1>
        <p id="resultText"></p>
        <button class="btn" id="next">СЛЕДУЮЩИЙ</button>
        <button class="btn" id="retry">ЗАНОВО</button>
        <button class="btn" id="home">МЕНЮ</button>
    </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight,DPR=1;

function resize(){
    W=innerWidth;
    H=innerHeight;
    DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=W*DPR;
    canvas.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

/* SAVE */

let save={unlocked:1,done:[]};

try{
    const s=JSON.parse(localStorage.getItem("GoToGeomtrSave"));
    if(s){
        save.unlocked=Math.max(1,Math.min(100,s.unlocked||1));
        save.done=Array.isArray(s.done)?s.done:[];
    }
}catch(e){}

function saveGame(){
    localStorage.setItem("GoToGeomtrSave",JSON.stringify(save));
}

/* MENU */

const menu=document.getElementById("menu");
const levels=document.getElementById("levels");

function makeMenu(){
    document.getElementById("openCount").textContent=save.unlocked;
    document.getElementById("doneCount").textContent=save.done.length;
    levels.innerHTML="";

    for(let i=1;i<=100;i++){
        const b=document.createElement("button");
        b.className="level";

        if(i>save.unlocked){
            b.classList.add("lock");
            b.textContent=i+" 🔒";
        }else{
            if(save.done.includes(i))b.classList.add("done");
            b.textContent=save.done.includes(i)?i+" ★":i;
            b.onclick=()=>start(i);
        }

        levels.appendChild(b);
    }
}
makeMenu();

/* GAME */

let playing=false;
let level=1;
let objects=[];
let levelLength=0;
let camera=0;
let coinCount=0;
let last=0;
let particles=[];
let shake=0;

const player={
    x:100,
    y:0,
    w:38,
    h:38,
    vx:6,
    vy:0,
    gravity:.8,
    jump:-14.5,
    grounded:false,
    coyote:0,
    rot:0
};

function rnd(n){
    const x=Math.sin(n*999.123+level*17.71)*43758.5453;
    return x-Math.floor(x);
}

/* LEVEL GENERATION */

function generate(n){
    const arr=[];
    const ground=H*.72;
    let x=0;

    const difficulty=(n-1)/99;

    arr.push({
        type:"ground",
        x:0,y:ground,w:1200,h:500
    });

    for(let i=0;i<170;i++){

        let gapChance=.04+difficulty*.10;

        if(rnd(i*7)<gapChance){
            x+=90+rnd(i*8)*90;
        }

        const width=180+rnd(i*3)*190;

        arr.push({
            type:"ground",
            x:x,
            y:ground,
            w:width,
            h:500
        });

        if(rnd(i*11)<.12+difficulty*.28){
            const count=(n>50&&rnd(i*12)<.35)?2:1;

            for(let j=0;j<count;j++){
                arr.push({
                    type:"spike",
                    x:x+70+j*42,
                    y:ground-42,
                    w:42,
                    h:42
                });
            }
        }

        if(rnd(i*19)<.18){
            arr.push({
                type:"coin",
                x:x+110,
                y:ground-100-rnd(i*20)*80,
                r:14,
                got:false
            });
        }

        if(n>10&&rnd(i*31)<.08+difficulty*.12){
            arr.push({
                type:"block",
                x:x+130,
                y:ground-90,
                w:55,
                h:90
            });
        }

        if(n>15&&rnd(i*41)<.06+difficulty*.06){
            arr.push({
                type:"pad",
                x:x+150,
                y:ground-18,
                w:58,
                h:18
            });
        }

        x+=190+rnd(i*5)*180;
    }

    arr.push({
        type:"finish",
        x:x+250,
        y:ground-160,
        w:55,
        h:160
    });

    return {objects:arr,length:x+500};
}

/* START */

function start(n){
    if(n>save.unlocked)return;

    level=n;

    const data=generate(n);
    objects=data.objects;
    levelLength=data.length;

    player.x=120;
    player.y=H*.72-player.h;
    player.vx=6+Math.min(3,(n-1)*.025);
    player.vy=0;
    player.grounded=true;
    player.coyote=0;
    player.rot=0;

    camera=0;
    coinCount=0;
    particles=[];
    shake=0;

    document.getElementById("lvl").textContent=n;
    document.getElementById("coins").textContent=0;
    document.getElementById("fill").style.width="0%";

    menu.style.display="none";
    document.getElementById("ui").style.display="block";
    document.getElementById("result").style.display="none";

    playing=true;
    last=performance.now();

    requestAnimationFrame(loop);
}

/* INPUT */

function jump(){
    if(!playing)return;

    if(player.grounded||player.coyote>0){
        player.vy=player.jump;
        player.grounded=false;
        player.coyote=0;

        for(let i=0;i<10;i++){
            particles.push({
                x:player.x+19,
                y:player.y+38,
                vx:(Math.random()-.5)*5,
                vy:-Math.random()*4,
                life:1
            });
        }
    }
}

addEventListener("keydown",e=>{
    if(["Space","ArrowUp","KeyW"].includes(e.code)){
        e.preventDefault();
        jump();
    }
});

canvas.addEventListener("pointerdown",jump);

document.getElementById("jump").addEventListener("pointerdown",e=>{
    e.preventDefault();
    jump();
});

/* COLLISION */

function hit(a,b){
    return a.x<b.x+b.w &&
           a.x+a.w>b.x &&
           a.y<b.y+b.h &&
           a.y+a.h>b.y;
}

/* UPDATE */

function update(dt){

    const d=Math.min(dt/16.666,2);

    /*
       ВОТ ГЛАВНОЕ ИСПРАВЛЕНИЕ:
       персонаж теперь реально ДВИГАЕТСЯ ВПЕРЁД.
    */
    player.x+=player.vx*d;

    player.vy+=player.gravity*d;
    player.y+=player.vy*d;

    player.grounded=false;

    const p={
        x:player.x,
        y:player.y,
        w:player.w,
        h:player.h
    };

    for(const o of objects){

        if(o.type==="ground"||o.type==="block"){

            if(hit(p,o)){

                const oldBottom=
                    player.y-player.vy*d+player.h;

                if(oldBottom<=o.y+12&&player.vy>=0){

                    player.y=o.y-player.h;
                    player.vy=0;
                    player.grounded=true;
                    player.coyote=7;
                }
            }
        }
    }

    if(!player.grounded){
        player.coyote-=d;
        player.rot+=.12*d;
    }else{
        player.rot=
            Math.round(player.rot/(Math.PI/2))*(Math.PI/2);
    }

    /* SPIKES */

    for(const o of objects){
        if(o.type!=="spike")continue;

        const s={
            x:o.x+8,
            y:o.y+9,
            w:o.w-16,
            h:o.h-9
        };

        if(hit(p,s)){
            die();
            return;
        }
    }

    /* BLOCKS */

    for(const o of objects){
        if(o.type!=="block")continue;

        if(hit(p,o)){
            const oldBottom=
                player.y-player.vy*d+player.h;

            if(oldBottom>o.y+12){
                die();
                return;
            }
        }
    }

    /* PADS */

    for(const o of objects){
        if(o.type==="pad"&&hit(p,o)){
            player.vy=-20;
        }
    }

    /* COINS */

    for(const o of objects){

        if(o.type!=="coin"||o.got)continue;

        const dx=player.x+19-o.x;
        const dy=player.y+19-o.y;

        if(Math.hypot(dx,dy)<34){

            o.got=true;
            coinCount++;

            document.getElementById("coins").textContent=coinCount;

            for(let i=0;i<15;i++){
                particles.push({
                    x:o.x,
                    y:o.y,
                    vx:(Math.random()-.5)*6,
                    vy:(Math.random()-.5)*6,
                    life:1
                });
            }
        }
    }

    /* FINISH */

    for(const o of objects){
        if(o.type==="finish"&&hit(p,o)){
            win();
            return;
        }
    }

    /* FALL */

    if(player.y>H+200){
        die();
        return;
    }

    /* CAMERA */

    const target=player.x-W*.28;

    camera+=(target-camera)*.12;

    if(camera<0)camera=0;

    const maxCamera=Math.max(0,levelLength-W);

    if(camera>maxCamera)camera=maxCamera;

    const progress=Math.max(
        0,
        Math.min(
            100,
            player.x/levelLength*100
        )
    );

    document.getElementById("fill").style.width=progress+"%";

    /* PARTICLES */

    for(let i=particles.length-1;i>=0;i--){

        const q=particles[i];

        q.x+=q.vx*d;
        q.y+=q.vy*d;
        q.vy+=.15*d;
        q.life-=.035*d;

        if(q.life<=0)particles.splice(i,1);
    }

    shake*=.88;
}

/* DRAW */

function background(){

    const g=ctx.createLinearGradient(0,0,0,H);

    g.addColorStop(0,"#111e55");
    g.addColorStop(.55,"#090d28");
    g.addColorStop(1,"#02040d");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    /* stars */

    for(let i=0;i<90;i++){

        let x=((i*137-camera*.12)%W+W)%W;
        let y=(i*83)%(H*.6);

        ctx.globalAlpha=.2+
            Math.abs(Math.sin(performance.now()/700+i))*.3;

        ctx.fillStyle="#fff";
        ctx.fillRect(x,y,2,2);
    }

    ctx.globalAlpha=1;

    /* mountains */

    ctx.fillStyle="#080e27";
    ctx.beginPath();
    ctx.moveTo(0,H*.72);

    for(let x=0;x<=W;x+=60){
        ctx.lineTo(
            x,
            H*.72-
            Math.sin((x+camera*.15)*.008)*35
        );
    }

    ctx.lineTo(W,H);
    ctx.lineTo(0,H);
    ctx.fill();

    /* ground grid */

    ctx.fillStyle="#07142b";
    ctx.fillRect(0,H*.72,W,H*.28);

    ctx.strokeStyle="#28ddff14";

    for(let x=-(camera%60);x<W;x+=60){
        ctx.beginPath();
        ctx.moveTo(x,H*.72);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(let y=H*.72;y<H;y+=30){
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }
}

function drawObjects(){

    for(const o of objects){

        const x=o.x-camera;

        if(x<-150||x>W+150)continue;

        if(o.type==="ground"){
            ctx.fillStyle="#152b59";
            ctx.fillRect(x,o.y,o.w,o.h);

            ctx.fillStyle="#43eaff";
            ctx.fillRect(x,o.y,o.w,5);

            ctx.fillStyle="#ffffff0c";

            for(let xx=x;xx<x+o.w;xx+=32){
                ctx.fillRect(xx,o.y+8,2,50);
            }
        }

        if(o.type==="block"){
            ctx.fillStyle="#6759ed";
            ctx.fillRect(x,o.y,o.w,o.h);

            ctx.fillStyle="#9a91ff";
            ctx.fillRect(x,o.y,o.w,4);

            ctx.strokeStyle="#ffffff22";
            ctx.strokeRect(x,o.y,o.w,o.h);
        }

        if(o.type==="spike"){
            const grad=ctx.createLinearGradient(x,o.y,x,o.y+o.h);
            grad.addColorStop(0,"#fff");
            grad.addColorStop(.3,"#ff537e");
            grad.addColorStop(1,"#a20c43");

            ctx.fillStyle=grad;

            ctx.beginPath();
            ctx.moveTo(x,o.y+o.h);
            ctx.lineTo(x+o.w/2,o.y);
            ctx.lineTo(x+o.w,o.y+o.h);
            ctx.closePath();
            ctx.fill();
        }

        if(o.type==="coin"&&!o.got){

            ctx.save();
            ctx.translate(x,o.y);

            const sc=.75+
                Math.abs(Math.sin(performance.now()/180+x))*.25;

            ctx.scale(sc,1);

            ctx.shadowBlur=20;
            ctx.shadowColor="#ffe33d";

            ctx.fillStyle="#ffe33d";
            ctx.beginPath();
            ctx.arc(0,0,o.r,0,Math.PI*2);
            ctx.fill();

            ctx.strokeStyle="#fff";
            ctx.lineWidth=3;
            ctx.stroke();

            ctx.restore();
        }

        if(o.type==="pad"){

            ctx.shadowBlur=18;
            ctx.shadowColor="#3ff";

            ctx.fillStyle="#43eaff";
            ctx.fillRect(x,o.y,o.w,o.h);

            ctx.shadowBlur=0;

            ctx.fillStyle="#07112b";
            ctx.beginPath();
            ctx.moveTo(x+o.w/2,o.y+3);
            ctx.lineTo(x+o.w*.8,o.y+o.h-2);
            ctx.lineTo(x+o.w*.2,o.y+o.h-2);
            ctx.closePath();
            ctx.fill();
        }

        if(o.type==="finish"){

            ctx.shadowBlur=30;
            ctx.shadowColor="#42ff9b";

            for(let yy=0;yy<o.h;yy+=18){
                for(let xx=0;xx<o.w;xx+=18){

                    ctx.fillStyle=
                        ((xx/18+yy/18)%2===0)
                        ?"white"
                        :"#43ff9b";

                    ctx.fillRect(x+xx,o.y+yy,18,18);
                }
            }

            ctx.shadowBlur=0;
        }
    }
}

function drawPlayer(){

    ctx.save();

    const x=player.x-camera+19;
    const y=player.y+19;

    ctx.translate(x,y);
    ctx.rotate(player.rot);

    ctx.shadowBlur=25;
    ctx.shadowColor="#3deaff";

    const g=ctx.createLinearGradient(-20,-20,20,20);
    g.addColorStop(0,"#fff");
    g.addColorStop(.3,"#42efff");
    g.addColorStop(.7,"#526bff");
    g.addColorStop(1,"#7b35d8");

    ctx.fillStyle=g;

    ctx.beginPath();
    ctx.roundRect(-19,-19,38,38,7);
    ctx.fill();

    ctx.shadowBlur=0;

    /* face */

    ctx.fillStyle="#07102b";
    ctx.fillRect(-11,-8,7,7);
    ctx.fillRect(4,-8,7,7);
    ctx.fillRect(-10,6,20,4);

    ctx.strokeStyle="#fff9";
    ctx.lineWidth=2;
    ctx.strokeRect(-16,-16,32,32);

    ctx.restore();
}

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=p.life;
        ctx.fillStyle="#42eaff";

        ctx.beginPath();
        ctx.arc(
            p.x-camera,
            p.y,
            3*p.life,
            0,
            Math.PI*2
        );
        ctx.fill();
    }

    ctx.globalAlpha=1;
}

function render(){

    ctx.save();

    if(shake>1){
        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );
    }

    background();
    drawObjects();
    drawParticles();
    drawPlayer();

    ctx.restore();
}

/* LOOP */

function loop(time){

    if(!playing)return;

    const dt=Math.min(35,time-last);
    last=time;

    update(dt);
    render();

    if(playing){
        requestAnimationFrame(loop);
    }
}

/* DEATH */

function die(){

    if(!playing)return;

    playing=false;
    shake=15;

    for(let i=0;i<45;i++){
        particles.push({
            x:player.x+19,
            y:player.y+19,
            vx:(Math.random()-.5)*10,
            vy:(Math.random()-.5)*10,
            life:1
        });
    }

    setTimeout(()=>{
        showResult(
            "💥 ОЙ!",
            "Ты столкнулся с препятствием.<br>Попробуй ещё раз!",
            false
        );
    },250);
}

/* WIN */

function win(){

    if(!playing)return;

    playing=false;

    if(!save.done.includes(level)){
        save.done.push(level);
    }

    if(level<100){
        save.unlocked=Math.max(
            save.unlocked,
            level+1
        );
    }

    saveGame();

    showResult(
        level===100
        ?"👑 100 / 100!"
        :"🎉 УРОВЕНЬ ПРОЙДЕН!",
        "Уровень "+level+
        " завершён!<br>💎 Монет: "+coinCount,
        true
    );
}

/* RESULT */

function showResult(title,text,won){

    document.getElementById("result").style.display="flex";

    document.getElementById("resultTitle").innerHTML=title;
    document.getElementById("resultText").innerHTML=text;

    document.getElementById("next").style.display=
        won&&level<100?"inline-block":"none";
}

document.getElementById("next").onclick=()=>{
    document.getElementById("result").style.display="none";
    start(level+1);
};

document.getElementById("retry").onclick=()=>{
    document.getElementById("result").style.display="none";
    start(level);
};

document.getElementById("home").onclick=()=>{
    playing=false;
    document.getElementById("result").style.display="none";
    document.getElementById("ui").style.display="none";
    menu.style.display="block";
    makeMenu();
};

document.getElementById("continue").onclick=()=>{
    start(save.unlocked);
};

document.getElementById("reset").onclick=()=>{
    if(confirm("Удалить весь прогресс?")){
        save={unlocked:1,done:[]};
        saveGame();
        makeMenu();
    }
};

/* отключаем контекстное меню */

addEventListener("contextmenu",e=>e.preventDefault());

/* START */

makeMenu();
</script>
</body>
</html>
