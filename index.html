<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GoToGeomtr</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;color:#fff;font-family:Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

#menu{
 position:fixed;inset:0;z-index:10;overflow:auto;text-align:center;
 padding:35px 12px;
 background:radial-gradient(circle at 50% 15%,#263f9d,#111838 35%,#050711 78%);
}
.logo{
 font-size:clamp(48px,10vw,100px);font-weight:1000;font-style:italic;
 letter-spacing:-5px;text-shadow:0 6px #11152e,0 0 20px #45eaff,0 0 50px #45eaff;
}
.logo i{color:#45efff;font-style:normal}
.small{opacity:.65;letter-spacing:3px;margin-top:8px;font-weight:bold}
.buttons{margin:25px auto 10px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{
 border:2px solid #ffffff22;border-radius:14px;padding:13px 22px;color:#fff;
 background:linear-gradient(135deg,#21d8ff,#6357ff);font-size:16px;font-weight:900;
 cursor:pointer;box-shadow:0 5px #15183f;transition:.15s
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.15)}
.btn:active{transform:translateY(3px);box-shadow:0 2px #15183f}
.stats{opacity:.8;margin:12px}
#levels{
 width:min(1000px,95vw);margin:auto;padding:12px;
 display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));
 gap:9px;max-height:58vh;overflow:auto
}
.level{
 height:60px;border:2px solid #ffffff1d;border-radius:13px;color:#fff;
 background:linear-gradient(145deg,#1a2860,#0d1330);
 font-weight:1000;font-size:17px;cursor:pointer;box-shadow:0 4px #070a19
}
.level:hover{border-color:#42eaff;transform:translateY(-2px)}
.level.done{background:linear-gradient(145deg,#087c70,#123e53);border-color:#32f0d1}
.level.locked{opacity:.28;cursor:not-allowed}
.star{display:block;color:#fff044;font-size:11px}

#ui{position:fixed;inset:0;z-index:4;pointer-events:none}
.top{display:flex;justify-content:space-between;padding:12px;gap:8px}
.info{
 padding:8px 11px;border:2px solid #ffffff1d;border-radius:12px;
 background:#050a19b8;backdrop-filter:blur(7px);font-size:13px;font-weight:900
}
#bar{
 position:absolute;top:55px;left:50%;transform:translateX(-50%);
 width:min(600px,62vw);height:8px;background:#0009;border-radius:20px;overflow:hidden
}
#fill{height:100%;width:0;background:linear-gradient(90deg,#39efff,#65ff92,#fff04b);box-shadow:0 0 15px #42efff}
#hint{position:absolute;bottom:10px;width:100%;text-align:center;opacity:.55;font-size:12px}

#mobile{
 position:fixed;right:20px;bottom:20px;z-index:6;display:none;
 width:90px;height:70px;border:2px solid #ffffff35;border-radius:20px;
 color:#fff;background:#172961dd;font-size:28px;font-weight:1000
}

#overlay{
 position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
 background:#02040dcc;backdrop-filter:blur(7px)
}
.box{
 width:min(430px,90vw);padding:30px 20px;text-align:center;border-radius:24px;
 border:2px solid #ffffff25;background:linear-gradient(145deg,#1b2a67,#090d22);
 box-shadow:0 20px 70px #000
}
.box h1{font-size:38px;margin:0 0 10px}
.box p{opacity:.75;line-height:1.5}
.box .btn{margin:5px}

@media(max-width:700px){
 #mobile{display:block}
 .info{font-size:10px;padding:7px 8px}
 #bar{top:49px;width:55vw}
 #hint{display:none}
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="menu">
  <div class="logo">GoTo<i>Geomtr</i></div>
  <div class="small">100 ORIGINAL LEVELS</div>

  <div class="buttons">
    <button class="btn" id="continue">▶ ПРОДОЛЖИТЬ</button>
    <button class="btn" id="reset">↻ СБРОСИТЬ</button>
  </div>

  <div class="stats">
    Открыто: <b id="unlocked">1</b>/100
    &nbsp; • &nbsp;
    Пройдено: <b id="completed">0</b>
  </div>

  <div id="levels"></div>
</div>

<div id="ui" style="display:none">
  <div class="top">
    <div class="info">GoToGeomtr</div>
    <div class="info">LEVEL <span id="levelNum">1</span></div>
    <div class="info">💎 <span id="coinNum">0</span></div>
  </div>

  <div id="bar"><div id="fill"></div></div>
  <div id="hint">SPACE / ↑ / CLICK — ПРЫЖОК</div>
</div>

<button id="mobile">↑</button>

<div id="overlay">
  <div class="box">
    <h1 id="title">🎉 ПОБЕДА!</h1>
    <p id="description"></p>
    <button class="btn" id="next">СЛЕДУЮЩИЙ</button>
    <button class="btn" id="again">ЗАНОВО</button>
    <button class="btn" id="back">МЕНЮ</button>
  </div>
</div>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight,DPR=1;

function resize(){
 W=innerWidth;H=innerHeight;
 DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

/* ---------- SAVE ---------- */

const KEY="GoToGeomtr_Save";

let save;
try{
 save=JSON.parse(localStorage.getItem(KEY))||{};
}catch(e){save={}}

save.unlocked=Math.max(1,Math.min(100,save.unlocked||1));
save.completed=Array.isArray(save.completed)?save.completed:[];

function saveIt(){
 localStorage.setItem(KEY,JSON.stringify(save));
}

/* ---------- MENU ---------- */

const menu=document.getElementById("menu");
const ui=document.getElementById("ui");
const levels=document.getElementById("levels");
const unlocked=document.getElementById("unlocked");
const completed=document.getElementById("completed");

function buildMenu(){
 unlocked.textContent=save.unlocked;
 completed.textContent=save.completed.length;
 levels.innerHTML="";

 for(let i=1;i<=100;i++){
  const b=document.createElement("button");
  b.className="level";

  const done=save.completed.includes(i);
  const open=i<=save.unlocked;

  if(done)b.classList.add("done");
  if(!open)b.classList.add("locked");

  b.innerHTML=open
    ? i+(done?'<span class="star">★ ПРОЙДЕН</span>':'')
    : i+'<span class="star">🔒</span>';

  if(open)b.onclick=()=>start(i);

  levels.appendChild(b);
 }
}

buildMenu();

/* ---------- GAME ---------- */

let playing=false;
let current=1;
let objects=[];
let length=0;
let camera=0;
let coins=0;
let attempts=0;
let particles=[];
let shake=0;
let last=0;

const TILE=64;

const p={
 x:120,y:0,w:38,h:38,
 vx:6,vy:0,
 gravity:.78,
 jump:-14.3,
 ground:false,
 coyote:0,
 rot:0
};

/* ---------- DETERMINISTIC RANDOM ---------- */

function rnd(n){
 const x=Math.sin(n*127.731+current*83.17)*43758.5453;
 return x-Math.floor(x);
}

/* ---------- LEVEL ---------- */

function createLevel(n){
 current=n;

 const a=[];
 let x=0;

 const ground=H*.72;

 a.push({t:"block",x:0,y:ground,w:1000,h:500});

 const difficulty=(n-1)/99;

 for(let i=0;i<150;i++){

  const r=rnd(i*11+1);

  if(r>.07+difficulty*.08){
   a.push({
    t:"block",
    x:x,
    y:ground,
    w:128+rnd(i*3)*150,
    h:500
   });
  }else{
   x+=80;
  }

  if(rnd(i*17+3)<.12+difficulty*.26){
   const count=(difficulty>.55&&rnd(i*8)<.4)?2:1;

   for(let s=0;s<count;s++){
    a.push({
     t:"spike",
     x:x+45+s*38,
     y:ground-38,
     w:38,h:38
    });
   }
  }

  if(rnd(i*23+9)<.17){
   a.push({
    t:"coin",
    x:x+95,
    y:ground-100-rnd(i*5)*80,
    r:15,taken:false
   });
  }

  if(difficulty>.2&&rnd(i*31+4)<.08){
   a.push({
    t:"pad",
    x:x+130,
    y:ground-18,
    w:55,h:18
   });
  }

  if(i>8&&i%15===0){
   a.push({
    t:"portal",
    x:x+160,
    y:ground-120,
    w:34,h:120
   });
  }

  if(difficulty>.35&&rnd(i*43)<.13){
   a.push({
    t:"block",
    x:x+100,
    y:ground-100,
    w:64,h:100
   });
  }

  x+=180+Math.floor(rnd(i*51)*180);
 }

 a.push({
  t:"finish",
  x:x+250,
  y:ground-150,
  w:55,h:150
 });

 return {a,len:x+500};
}

/* ---------- START ---------- */

function start(n){

 if(n<1||n>100||n>save.unlocked)return;

 const data=createLevel(n);

 objects=data.a;
 length=data.len;

 current=n;
 coins=0;
 attempts=0;
 camera=0;
 particles=[];
 shake=0;

 p.x=150;
 p.y=H*.72-p.h;
 p.vx=6+Math.min(3,(n-1)*.025);
 p.vy=0;
 p.ground=false;
 p.coyote=0;
 p.rot=0;

 document.getElementById("levelNum").textContent=n;
 document.getElementById("coinNum").textContent=0;
 document.getElementById("fill").style.width="0%";

 menu.style.display="none";
 ui.style.display="block";
 document.getElementById("overlay").style.display="none";

 playing=true;
 last=performance.now();

 requestAnimationFrame(loop);
}

/* ---------- COLLISION ---------- */

function overlap(a,b){
 return a.x<b.x+b.w &&
        a.x+a.w>b.x &&
        a.y<b.y+b.h &&
        a.y+a.h>b.y;
}

/* ---------- JUMP ---------- */

function jump(){
 if(!playing)return;

 if(p.ground||p.coyote>0){
  p.vy=p.jump;
  p.ground=false;
  p.coyote=0;

  for(let i=0;i<10;i++)part(p.x+19,p.y+38,"#42efff");

  tone(480,.06);
 }
}

/* ---------- INPUT ---------- */

addEventListener("keydown",e=>{
 if(["Space","ArrowUp","KeyW"].includes(e.code)){
  e.preventDefault();
  jump();
 }
 if(e.code==="Escape"&&playing)backMenu();
});

canvas.addEventListener("pointerdown",jump);
document.getElementById("mobile").addEventListener("pointerdown",e=>{
 e.preventDefault();jump();
});

/* ---------- AUDIO ---------- */

let ac=null;

function tone(freq,dur){
 try{
  ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state==="suspended")ac.resume();

  const o=ac.createOscillator();
  const g=ac.createGain();

  o.type="square";
  o.frequency.value=freq;
  g.gain.setValueAtTime(.035,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);

  o.connect(g);g.connect(ac.destination);
  o.start();o.stop(ac.currentTime+dur);
 }catch(e){}
}

/* ---------- PARTICLES ---------- */

function part(x,y,color){
 particles.push({
  x,y,
  vx:(Math.random()-.5)*7,
  vy:(Math.random()-.5)*7,
  life:1,
  size:2+Math.random()*4,
  color
 });
}

function burst(x,y,color,count=30){
 for(let i=0;i<count;i++)part(x,y,color);
}

function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const q=particles[i];
  q.x+=q.vx*dt;
  q.y+=q.vy*dt;
  q.vy+=.18*dt;
  q.life-=.025*dt;
  if(q.life<=0)particles.splice(i,1);
 }
}

/* ---------- UPDATE ---------- */

function update(ms){

 const dt=Math.min(2,ms/16.666);

 p.vy+=p.gravity*dt;
 p.y+=p.vy*dt;
 p.ground=false;

 const rect={
  x:p.x,y:p.y,w:p.w,h:p.h
 };

 for(const o of objects){

  if(o.t!=="block")continue;
  if(!overlap(rect,o))continue;

  const oldBottom=p.y-p.vy*dt+p.h;

  if(oldBottom<=o.y+10&&p.vy>=0){
   p.y=o.y-p.h;
   p.vy=0;
   p.ground=true;
   p.coyote=7;
   p.rot=Math.round(p.rot/(Math.PI/2))*(Math.PI/2);
  }
 }

 if(!p.ground)p.coyote-=dt;

 p.rot+=p.ground?0:.13*dt;

 /* spikes */

 for(const o of objects){
  if(o.t!=="spike")continue;

  const s={
   x:o.x+7,y:o.y+9,
   w:o.w-14,h:o.h-9
  };

  if(overlap(rect,s)){
   die();
   return;
  }
 }

 /* pads */

 for(const o of objects){
  if(o.t==="pad"&&overlap(rect,o)){
   p.vy=-20;
   burst(p.x+19,p.y+38,"#53f5ff",12);
   tone(700,.07);
  }
 }

 /* coins */

 for(const o of objects){
  if(o.t!=="coin"||o.taken)continue;

  const dx=p.x+19-o.x;
  const dy=p.y+19-o.y;

  if(Math.hypot(dx,dy)<35){
   o.taken=true;
   coins++;
   document.getElementById("coinNum").textContent=coins;
   burst(o.x,o.y,"#ffe84a",18);
   tone(900,.08);
  }
 }

 /* portals */

 for(const o of objects){
  if(o.t==="portal"&&overlap(rect,o)){
   p.vx+=.15;
  }
 }

 /* finish */

 for(const o of objects){
  if(o.t==="finish"&&overlap(rect,o)){
   win();
   return;
  }
 }

 if(p.y>H+150){
  die();
  return;
 }

 const target=p.x-W*.28;

 camera+=(target-camera)*.1;
 camera=Math.max(0,Math.min(length-W,camera));

 const percent=Math.min(100,Math.max(0,p.x/length*100));
 document.getElementById("fill").style.width=percent+"%";

 updateParticles(dt);

 shake*=.88;
}

/* ---------- DEATH ---------- */

function die(){
 if(!playing)return;

 playing=false;
 attempts++;

 burst(p.x+19,p.y+19,"#ff426f",35);
 burst(p.x+19,p.y+19,"#42eaff",20);

 shake=15;
 tone(100,.18);

 setTimeout(()=>{
  showResult(
   "💥 УПС!",
   "Ты столкнулся с препятствием.<br>Попробуй ещё раз!",
   false
  );
 },250);
}

/* ---------- WIN ---------- */

function win(){
 if(!playing)return;

 playing=false;

 if(!save.completed.includes(current))
  save.completed.push(current);

 if(current<100)
  save.unlocked=Math.max(save.unlocked,current+1);

 saveIt();

 burst(p.x,p.y,"#fff04a",60);
 burst(p.x,p.y,"#43efff",50);

 tone(523,.1);
 setTimeout(()=>tone(659,.1),100);
 setTimeout(()=>tone(784,.18),200);

 setTimeout(()=>{
  showResult(
   current===100?"👑 100 / 100!":"🎉 УРОВЕНЬ ПРОЙДЕН!",
   `GoToGeomtr — уровень ${current}<br>💎 Монет собрано: <b>${coins}</b>`,
   true
  );
 },300);
}

/* ---------- RESULT ---------- */

function showResult(title,text,won){

 document.getElementById("overlay").style.display="flex";
 document.getElementById("title").innerHTML=title;
 document.getElementById("description").innerHTML=text;

 document.getElementById("next").style.display=
  won&&current<100?"inline-block":"none";
}

/* ---------- DRAW BACKGROUND ---------- */

function background(){

 const hue=(current*37)%360;

 const g=ctx.createLinearGradient(0,0,0,H);

 g.addColorStop(0,`hsl(${hue},65%,18%)`);
 g.addColorStop(.55,`hsl(${(hue+30)%360},55%,10%)`);
 g.addColorStop(1,"#03050d");

 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 /* stars */

 for(let i=0;i<90;i++){
  const x=(i*193-current*40)%W;
  const y=(i*83)%Math.floor(H*.65);

  ctx.globalAlpha=.2+Math.abs(Math.sin(performance.now()/700+i))*.3;
  ctx.fillStyle="#fff";
  ctx.fillRect(x,y,2,2);
 }

 ctx.globalAlpha=1;

 /* mountains */

 ctx.fillStyle="#080e25";
 ctx.beginPath();
 ctx.moveTo(0,H*.67);

 for(let x=0;x<=W;x+=70){
  ctx.lineTo(
   x,
   H*.67-Math.sin((x+camera*.12)*.006)*45
  );
 }

 ctx.lineTo(W,H);
 ctx.lineTo(0,H);
 ctx.fill();

 /* floor */

 ctx.fillStyle="#08142b";
 ctx.fillRect(0,H*.72,W,H*.28);

 ctx.strokeStyle="#27dfff16";
 ctx.lineWidth=1;

 const off=-(camera%64);

 for(let x=off;x<W;x+=64){
  ctx.beginPath();
  ctx.moveTo(x,H*.72);
  ctx.lineTo(x,H);
  ctx.stroke();
 }

 for(let y=H*.72;y<H;y+=32){
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(W,y);
  ctx.stroke();
 }
}

/* ---------- DRAW OBJECTS ---------- */

function drawObjects(){

 for(const o of objects){

  const x=o.x-camera;

  if(x<-150||x>W+150)continue;

  if(o.t==="block"){

   const hue=(current*37)%360;

   const g=ctx.createLinearGradient(x,o.y,x+o.w,o.y+70);
   g.addColorStop(0,`hsl(${hue},85%,62%)`);
   g.addColorStop(1,`hsl(${(hue+65)%360},80%,38%)`);

   ctx.fillStyle=g;
   ctx.fillRect(x,o.y,o.w,o.h);

   ctx.fillStyle="#fff2";
   ctx.fillRect(x,o.y,o.w,5);

   ctx.strokeStyle="#ffffff18";

   for(let xx=x+16;xx<x+o.w;xx+=32){
    ctx.beginPath();
    ctx.moveTo(xx,o.y);
    ctx.lineTo(xx,Math.min(o.y+64,o.y+o.h));
    ctx.stroke();
   }
  }

  if(o.t==="spike"){
   ctx.save();
   ctx.shadowBlur=14;
   ctx.shadowColor="#ff416e";

   const g=ctx.createLinearGradient(x,o.y,x,o.y+o.h);
   g.addColorStop(0,"#fff");
   g.addColorStop(.3,"#ff6688");
   g.addColorStop(1,"#a80f46");

   ctx.fillStyle=g;
   ctx.beginPath();
   ctx.moveTo(x,o.y+o.h);
   ctx.lineTo(x+o.w/2,o.y);
   ctx.lineTo(x+o.w,o.y+o.h);
   ctx.closePath();
   ctx.fill();

   ctx.restore();
  }

  if(o.t==="coin"&&!o.taken){
   ctx.save();

   const s=.75+Math.abs(Math.sin(performance.now()/180+x))*.25;
   ctx.translate(x,o.y);
   ctx.scale(s,1);

   ctx.shadowBlur=18;
   ctx.shadowColor="#ffe84a";

   const g=ctx.createRadialGradient(-5,-6,2,0,0,o.r);
   g.addColorStop(0,"#fff");
   g.addColorStop(.3,"#fff04c");
   g.addColorStop(1,"#f59c00");

   ctx.fillStyle=g;
   ctx.beginPath();
   ctx.arc(0,0,o.r,0,Math.PI*2);
   ctx.fill();

   ctx.strokeStyle="#fff9a0";
   ctx.lineWidth=3;
   ctx.stroke();

   ctx.restore();
  }

  if(o.t==="pad"){
   ctx.save();
   ctx.shadowBlur=18;
   ctx.shadowColor="#46edff";

   ctx.fillStyle="#45edff";
   ctx.beginPath();
   ctx.roundRect(x,o.y,o.w,o.h,7);
   ctx.fill();

   ctx.fillStyle="#071126";
   ctx.beginPath();
   ctx.moveTo(x+o.w/2,o.y+3);
   ctx.lineTo(x+o.w*.78,o.y+o.h-3);
   ctx.lineTo(x+o.w*.22,o.y+o.h-3);
   ctx.closePath();
   ctx.fill();

   ctx.restore();
  }

  if(o.t==="portal"){
   ctx.save();
   ctx.shadowBlur=25;
   ctx.shadowColor="#b64cff";

   ctx.fillStyle="#c855ff";
   ctx.beginPath();
   ctx.roundRect(x,o.y,o.w,o.h,17);
   ctx.fill();

   ctx.fillStyle="#080a20";
   ctx.beginPath();
   ctx.roundRect(x+7,o.y+7,o.w-14,o.h-14,12);
   ctx.fill();

   ctx.restore();
  }

  if(o.t==="finish"){
   ctx.save();
   ctx.shadowBlur=30;
   ctx.shadowColor="#48ff9b";

   ctx.fillStyle="#48ff9b";
   ctx.fillRect(x,o.y,o.w,o.h);

   const s=18;

   for(let yy=o.y;yy<o.y+o.h;yy+=s){
    for(let xx=x;xx<x+o.w;xx+=s){
     if(((xx-x)/s+(yy-o.y)/s)%2===0){
      ctx.fillStyle="#07152a";
      ctx.fillRect(xx,yy,s,s);
     }
    }
   }

   ctx.restore();
  }
 }
}

/* ---------- PLAYER ---------- */

function drawPlayer(){

 const x=p.x-camera+19;
 const y=p.y+19;

 ctx.save();

 ctx.translate(x,y);
 ctx.rotate(p.rot);

 ctx.shadowBlur=20;
 ctx.shadowColor="#43efff";

 const g=ctx.createLinearGradient(-20,-20,20,20);

 g.addColorStop(0,"#fff");
 g.addColorStop(.25,"#54f5ff");
 g.addColorStop(.7,"#5270ff");
 g.addColorStop(1,"#8138dc");

 ctx.fillStyle=g;

 ctx.beginPath();
 ctx.roundRect(-19,-19,38,38,7);
 ctx.fill();

 ctx.fillStyle="#07102b";

 ctx.fillRect(-11,-8,7,7);
 ctx.fillRect(4,-8,7,7);
 ctx.fillRect(-10,6,20,4);

 ctx.strokeStyle="#ffffff77";
 ctx.lineWidth=2;
 ctx.strokeRect(-16,-16,32,32);

 ctx.restore();
}

/* ---------- PARTICLES ---------- */

function drawParticles(){

 for(const q of particles){
  ctx.globalAlpha=Math.max(0,q.life);
  ctx.fillStyle=q.color;

  ctx.beginPath();
  ctx.arc(q.x-camera,q.y,q.size*q.life,0,Math.PI*2);
  ctx.fill();
 }

 ctx.globalAlpha=1;
}

/* ---------- DRAW ---------- */

function draw(){

 ctx.save();

 if(shake>1){
  ctx.translate(
   (Math.random()-.5)*shake,
   (Math.random()-.5)*shake
  );
 }

 background();
 drawObjects();
 drawParticles();
 drawPlayer();

 ctx.restore();
}

/* ---------- LOOP ---------- */

function loop(now){

 if(!playing)return;

 const dt=Math.min(35,now-last);
 last=now;

 update(dt);
 draw();

 if(playing)requestAnimationFrame(loop);
}

/* ---------- MENU ACTIONS ---------- */

document.getElementById("continue").onclick=()=>{
 start(save.unlocked);
};

document.getElementById("reset").onclick=()=>{
 if(confirm("Сбросить весь прогресс GoToGeomtr?")){
  save={unlocked:1,completed:[]};
  saveIt();
  buildMenu();
 }
};

document.getElementById("next").onclick=()=>{
 document.getElementById("overlay").style.display="none";
 if(current<100)start(current+1);
};

document.getElementById("again").onclick=()=>{
 document.getElementById("overlay").style.display="none";
 start(current);
};

document.getElementById("back").onclick=backMenu;

function backMenu(){
 playing=false;
 ui.style.display="none";
 document.getElementById("overlay").style.display="none";
 menu.style.display="block";
 buildMenu();
}

/* ---------- TOUCH ---------- */

let touchY=0;

addEventListener("touchstart",e=>{
 touchY=e.touches[0].clientY;
},{passive:true});

addEventListener("touchend",e=>{
 const y=e.changedTouches[0].clientY;

 if(Math.abs(y-touchY)<60)jump();
},{passive:true});

addEventListener("contextmenu",e=>e.preventDefault());

/* ---------- INITIAL ---------- */

buildMenu();
</script>

</body>
</html>
